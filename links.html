  .link:hover, .link:focus-visible{ transform:translateY(-2px); border-color:var(--spark); outline:none; }
  .link.main{ background:var(--bone-bright); color:#0B0B0A; border-color:var(--bone-bright); }
  .link.main:hover{ background:var(--spark); border-color:var(--spark); }
  .ico{ width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(240,201,74,.12); }
  .main .ico{ background:rgba(11,11,10,.10); }
  .ico svg{ width:20px; height:20px; stroke:var(--spark); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .txt b{ display:block; font-size:15px; font-weight:700; }

  .arrow{ margin-left:auto; width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; opacity:.5; }
  footer{ margin-top:34px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:3px; color:var(--text-faint); }
